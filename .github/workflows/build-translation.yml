name: Translation feature build

on:
  push:
    branches: [ feat/translation ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.0.2
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > build.log 2>&1
          exit_code=$?
          python3 - <<'PY'
          import pathlib
          log = pathlib.Path('build.log')
          lines = log.read_text(encoding='utf-8', errors='replace').splitlines() if log.exists() else []
          picked = []
          for i, line in enumerate(lines):
              if 'What went wrong' in line:
                  picked.extend(lines[i:i + 10])
                  break
          picked.extend([l for l in lines if l.startswith('e: ')][:6])
          if not picked:
              picked = lines[-15:]
          for line in picked[:10]:
              print('::error::' + line.strip()[:600])
          PY
          tail -60 build.log
          exit $exit_code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: florisboard-translation-build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: florisboard-translation-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
